name: Axiom
version: '1.0'
main: net.kroesch.axiom.AxiomPlugin
api-version: '1.21'
commands:
  hallo:
    description: Ein einfacher Testbefehl
    usage: /<command>
  cleararea:
    description: Räumt einen Quader leer (um dich herum oder ab einer Ecke).
    usage: /<command> <länge> <breite> [höhe] [corner [x y z]]
    aliases: [ ca, clearrect ]
    permission: axiom.command.cleararea
  buildwall:
    description: Baut eine Mauer mit fester Stärke um dich herum.
    usage: /<command> <länge> <breite> <höhe> [material]
    aliases: [ bw, wall ]
  digtunnel:
    description: Gräbt einen 2x2 Tunnel mit Schienen und Fackeln.
    usage: /<command> <länge>
    aliases: [dt, tunnel]
  spiralstair:
    description: Baut eine spiralförmige Treppe nach unten um einen 2x2 Kern.
    usage: /spiralstair <depth>
    aliases: [ss, spiral]
  buildportal:
    description: Baut ein Nether-Portal am Standort des Spielers.
    usage: /<command>
    permission: axiom.command.buildportal
  starterkit:
    description: Erstellt eine grosse Kiste mit einer Starter-Ausrüstung.
    usage: /<command>
    permission: axiom.command.kit.starter
  mineshaft:
    description: Gräbt einen Minenschacht basierend auf der Blickrichtung.
    usage: /<command> [tiefe]
    aliases: [ms]
    permission: axiom.mineshaft # Optional: Wenn du Rechte dafür vergeben willst
permissions:
  axiom.command.cleararea:
    description: Erlaubt /cleararea
    default: op
  axiom.command.*:
    description: Alle Axiom-Befehle
    default: op
    children:
      axiom.command.cleararea: true
  axiom.*:
    description: Alle Axiom-Funktionen
    default: op
    children:
      axiom.command.*: true